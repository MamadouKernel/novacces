name: novacces

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: novacces
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Jamais de "ports:" ici : Postgres ne doit être joignable que par les
    # autres conteneurs du réseau interne, jamais depuis l'extérieur du VPS
    # (voir docs/deploiement.md §2).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d novacces"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: src/NovAcces.Api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=novacces;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      # Rôle PROPRIÉTAIRE distinct (seconde barrière d'inaltérabilité des
      # journaux, §4/§7) — voir tools/provisionner-roles-postgres.sql. Vides
      # par défaut (repli sur le rôle unique ci-dessus, avertissement au
      # démarrage de l'API, voir Program.cs). À renseigner dans .env une fois
      # provisionner-roles-postgres.sql exécuté sur le VPS.
      ConnectionStrings__PostgresOwner: "Host=postgres;Port=5432;Database=novacces;Username=${POSTGRES_OWNER_USER:-};Password=${POSTGRES_OWNER_PASSWORD:-}"
      Database__ApplicationRole: ${POSTGRES_USER}
      Api__PublicBaseUrl: ${API_PUBLIC_BASE_URL}
      Web__PublicBaseUrl: https://${DOMAIN}
      Auth__PasswordResetEnabled: ${PASSWORD_RESET_ENABLED:-false}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      QrSigning__PrivateKeyPem: ${QR_SIGNING_PRIVATE_KEY_PEM}
      QrSigning__PublicKeyPem: ${QR_SIGNING_PUBLIC_KEY_PEM}
      WebPush__VapidPublicKey: ${WEBPUSH_VAPID_PUBLIC_KEY}
      WebPush__VapidPrivateKey: ${WEBPUSH_VAPID_PRIVATE_KEY}
      WebPush__Subject: ${WEBPUSH_SUBJECT}
      Smtp__Host: ${SMTP_HOST}
      Smtp__Port: ${SMTP_PORT}
      Smtp__EnableSsl: "true"
      Smtp__Username: ${SMTP_USERNAME}
      Smtp__Password: ${SMTP_PASSWORD}
      Smtp__FromAddress: ${SMTP_FROM_ADDRESS}
      Smtp__FromDisplayName: ${SMTP_FROM_DISPLAY_NAME:-NovAcces — Contrôle des accès}
      SeedAdmin__Email: ${SEED_ADMIN_EMAIL}
      SeedAdmin__Password: ${SEED_ADMIN_PASSWORD}
      SeedAdmin__DisplayName: ${SEED_ADMIN_DISPLAY_NAME}
      # Doc Swagger en production : désactivée par défaut, à activer
      # ponctuellement via API_ENABLE_SWAGGER=true dans .env (voir README).
      Api__EnableSwagger: ${API_ENABLE_SWAGGER:-false}
      # Sauvegarde automatique/chiffrée (§7.4, revue du 10/08/2026) — voir
      # BackupScheduler. Désactivée par défaut : la production refuse de
      # démarrer avec AutoBackup activé sans passphrase configurée (voir
      # ProductionConfigurationValidator). Réplication hors-site optionnelle,
      # désactivée par défaut (aucun compartiment S3 fourni ici).
      DatabaseBackup__AutoBackup__Enabled: ${DATABASEBACKUP_AUTOBACKUP_ENABLED:-false}
      DatabaseBackup__EncryptionPassphrase: ${DATABASEBACKUP_ENCRYPTIONPASSPHRASE:-}
      DatabaseBackup__Offsite__Enabled: ${DATABASEBACKUP_OFFSITE_ENABLED:-false}
      DatabaseBackup__Offsite__ServiceUrl: ${DATABASEBACKUP_OFFSITE_SERVICEURL:-}
      DatabaseBackup__Offsite__BucketName: ${DATABASEBACKUP_OFFSITE_BUCKETNAME:-}
      DatabaseBackup__Offsite__AccessKey: ${DATABASEBACKUP_OFFSITE_ACCESSKEY:-}
      DatabaseBackup__Offsite__SecretKey: ${DATABASEBACKUP_OFFSITE_SECRETKEY:-}
    # Pas de "ports:" publiés directement : Caddy reverse-proxy vers ce
    # service par son nom DNS interne ("api"). L'app agent mobile (terminaux)
    # passe aussi par Caddy, jamais directement sur ce conteneur.
    volumes:
      # Clés DataProtection persistées (voir Program.cs) : sans ce volume,
      # chaque recréation du conteneur invalide les jetons en cours
      # (réinitialisation de mot de passe, confirmation d'email).
      - api_keys:/app/keys
      # Sauvegardes de base (SuperAdmin, IDatabaseBackupService) : sans ce
      # volume, une sauvegarde disparaîtrait au prochain redéploiement au
      # lieu de survivre à la recréation du conteneur.
      - database_backups:/app/backups
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: src/NovAcces.Web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Nom DNS interne du service "api" : le Blazor Server (NovAcces.Web)
      # exécute TOUT son C# côté serveur, y compris la connexion SignalR vers
      # l'API (voir AdminOverview.razor) — le navigateur du visiteur ne parle
      # jamais directement à l'API, seulement à ce conteneur Web.
      Api__BaseUrl: http://api:8080
    volumes:
      # Clés DataProtection (antiforgery Blazor Server) — même raison que côté
      # api : persister au-delà de la durée de vie du conteneur.
      - web_keys:/app/keys
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
      - web
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  api_keys:
  web_keys:
  database_backups:
